name: Deploy NurseKit site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site and fingerprint assets
        env:
          SITE_DIR: ${{ runner.temp }}/nuserkit-site
        run: |
          mkdir -p "$SITE_DIR"
          cp -R index.html capturas.html normas-uso.html privacidad.html CSS JS RECURSOS "$SITE_DIR/"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const siteDir = process.env.SITE_DIR;
          const htmlFiles = fs.readdirSync(siteDir).filter((file) => file.endsWith(".html"));
          const assetPattern = /((?:CSS|JS|RECURSOS)\/[^"'?]+)\?v=__BUILD_VERSION__/g;

          for (const htmlFile of htmlFiles) {
            const htmlPath = path.join(siteDir, htmlFile);
            const html = fs.readFileSync(htmlPath, "utf8").replace(assetPattern, (reference, assetPath) => {
              const localPath = path.join(siteDir, assetPath);
              if (!fs.existsSync(localPath)) {
                throw new Error(`Referenced asset does not exist: ${assetPath} in ${htmlFile}`);
              }

              const digest = crypto.createHash("sha256").update(fs.readFileSync(localPath)).digest("hex").slice(0, 16);
              return `${assetPath}?v=${digest}`;
            });

            if (html.includes("__BUILD_VERSION__")) {
              throw new Error(`Unreplaced asset version placeholder in ${htmlFile}`);
            }
            fs.writeFileSync(htmlPath, html);
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nuserkit-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
